# ── Rate limiting zone (10 req/s, burst 20) ───────────────────────
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# ── Frontend (this container) ──────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for index.html
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ── API proxy with rate limiting ─────────────────────────────
    location /api/ {
        # Rate limit login endpoint more aggressively
        location /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass https://backscan.accesaniga.ar/api/v1/auth/login;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host backscan.accesaniga.ar;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            client_max_body_size 50m;
        }

        # General API rate limit
        limit_req zone=api burst=20 nodelay;
        proxy_pass https://backscan.accesaniga.ar/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_set_header Host backscan.accesaniga.ar;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 50m;
    }

    # ── Security headers ───────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://backscan.accesaniga.ar; manifest-src 'self'; worker-src 'self' blob:;" always;

    # Gzip for text-based responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
