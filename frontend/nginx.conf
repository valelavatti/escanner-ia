# ── Frontend (this container) ──────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all unknown paths serve index.html so SvelteKit client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite outputs hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for index.html — always serve fresh so deploys pick up new SPA bundles
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ── API proxy — forward to the backend container ────────────────
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming + long-running requests
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # Larger max body size for file uploads (Excel import, ZIP download)
        client_max_body_size 50m;
    }

    # ── Security headers (lightweight) ─────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip for text-based responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
